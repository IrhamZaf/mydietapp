workflows:
  ios-workflow:
    name: iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "MyDiet API Key"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Uses Code signing identities: production cert "MyDiet_Cert"
      # plus any App Store profile for this bundle ID.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vinculotech.Tests-iOS
      vars:
        BUNDLE_ID: "com.vinculotech.Tests-iOS"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BASE_URL: "https://mydiet.vinculotech.com/api/v1"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install
          fi
      - name: Flutter build IPA
        script: |
          set -euo pipefail
          # CFBundleVersion must increase for every App Store Connect upload.
          LATEST="$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)"
          BUILD_NUMBER="$((LATEST + 1))"
          if [ "${PROJECT_BUILD_NUMBER:-0}" -gt "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          fi
          echo "Using build number: $BUILD_NUMBER (latest TestFlight: $LATEST)"
          flutter build ipa --release \
            --dart-define=BASE_URL="$BASE_URL" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only — internal testers can install after ASC processing.
        # Do not submit for external TestFlight beta review.
        submit_to_testflight: false
