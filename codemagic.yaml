workflows:
  ios-workflow:
    name: iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "MyDiet API Key"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Uses Code signing identities: production cert "MyDiet_Cert"
      # plus any App Store profile for this bundle ID.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vinculotech.Tests-iOS
      vars:
        BUNDLE_ID: "com.vinculotech.Tests-iOS"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install
          fi
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only — internal testers can install after ASC processing.
        # Do not submit for external TestFlight beta review.
        submit_to_testflight: false
