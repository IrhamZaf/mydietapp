workflows:
  ios-workflow:
    name: iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "MyDiet API Key"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.vinculotech.Tests-iOS"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      # Required: RSA private key used to create/match the Apple Distribution certificate.
      # Add CERTIFICATE_PRIVATE_KEY in Codemagic → App settings → Environment variables
      # (group it into this workflow), or paste an encrypted value here.
    scripts:
      - name: Set up keychain & fetch signing files
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install
          fi
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
